# Model mix for `manage.py seed_demo --models-file`. `kind` is one of chat, embedding, speech,
# transcription, or image. `weight` is the model's relative share of requests. `reasoning: true`
# gives a chat model reasoning tokens. Every name must be in the router config, or pass
# `--write-router-config <path>` to write a router config that serves exactly these models.
models:
  - {name: gpt-4.1-nano, kind: chat, weight: 60}
  - {name: text-embedding-ada-002, kind: embedding, weight: 25}
  - {name: whisper-1, kind: transcription, weight: 6}
  - {name: gpt-4o-mini-tts, kind: speech, weight: 3}
  - {name: gpt-image-1, kind: image, weight: 1}
