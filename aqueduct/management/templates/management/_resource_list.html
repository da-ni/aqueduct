{% extends "management/base.html" %}

{% block body %}
<section class="card bg-base-200">
    <div class="card-body p-3">
        <div class="overflow-x-auto">
            <table class="table resource-table">
                <thead><tr>{% block columns %}{% endblock %}</tr></thead>
                <tbody>{% block rows %}{% endblock %}</tbody>
            </table>
        </div>
        {% include "management/_pager.html" with pages=listing.pages %}
    </div>
</section>

<p class="muted font-mono text-xs">{{ listing.summary }}</p>
{% endblock %}
