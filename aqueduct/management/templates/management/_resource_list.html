{% extends "management/base.html" %}

{% block page_background %}{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
    <header class="flex min-h-12 flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl font-semibold">{% block heading %}{% endblock %}</h1>
    </header>

    <section class="card bg-base-200">
        <div class="card-body p-3">
            <div class="overflow-x-auto">
                <table class="table resource-table">
                    <thead><tr>{% block columns %}{% endblock %}</tr></thead>
                    <tbody>{% block rows %}{% endblock %}</tbody>
                </table>
            </div>
        </div>
    </section>

    <p class="muted font-mono text-xs">{{ listing.summary }}</p>
    {% block after %}{% endblock %}
</div>
{% endblock %}
