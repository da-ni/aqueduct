<div class="aq-tip-host chart-col flex min-w-0 flex-1 flex-col items-center gap-2" role="img" aria-label="{{ column.tip }}">
    <div class="vbar w-full max-w-10 flex-1" style="--bar: {{ column.height }}%">
        {% for css, height in column.segments %}<i class="{{ css }}" style="height: {{ height }}%"></i>{% endfor %}
        {% include "management/_tip.html" with tip=column.tip %}
    </div>
    <span class="muted h-4 whitespace-nowrap font-mono text-xs">{{ column.label }}</span>
</div>
