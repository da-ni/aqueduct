{% load i18n ui %}
{% if limits.is_unlimited %}
    <p class="muted text-sm">{% translate "No limits" %}</p>
{% else %}
    <dl class="flex flex-wrap items-baseline gap-x-6 gap-y-1 text-sm">
        {% for label, value in limits.per_minute %}
            {% include "management/_figure.html" with value=value|grouped %}
        {% endfor %}
    </dl>
    {% if note %}<p class="muted text-sm">{{ note }}</p>{% endif %}
{% endif %}
