{% load ui %}
<div class="flex w-full gap-6">
    {% for window in windows %}
        <div class="flex-1 min-w-0" title="{{ window.title }}">
            <div class="flex items-baseline justify-between mb-1">
                <span class="text-[0.7rem] opacity-60">{{ window.label }}</span>
                <span class="text-[0.7rem] tabular-nums opacity-70">
                    {% if window.limit %}{{ window.used }}/{{ window.limit|grouped }}{% else %}—{% endif %}
                </span>
            </div>
            {% if window.limit %}
                <progress class="progress w-full {{ window.tone }}" value="{{ window.percent }}" max="100"></progress>
            {% endif %}
        </div>
    {% endfor %}
</div>
