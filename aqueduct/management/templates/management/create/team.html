{% extends "management/base.html" %}

{% block page_background %}{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
    <div class="breadcrumbs p-0 text-sm">
        <ul><li><a href="{% url 'org' %}">Teams</a></li><li>Create</li></ul>
    </div>
    <header class="flex min-h-12 flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl font-semibold">{{ view_title }}</h1>
    </header>

    <form method="post" class="card max-w-2xl bg-base-200">
        {% csrf_token %}
        <div class="card-body gap-6 p-6">
            {% include "management/_form_fields.html" %}
            <div class="flex flex-wrap gap-3 border-t border-base-300 pt-5">
                <button type="submit" class="btn btn-primary">Create team</button>
                <a class="btn btn-outline btn-primary" href="{% url 'org' %}">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
