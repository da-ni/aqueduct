{% extends "management/base.html" %}
{% load ui %}

{% block page_background %}{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
    <div class="breadcrumbs p-0 text-sm">
        <ul><li><a href="{% url 'tokens' %}">API keys</a></li><li>Create</li></ul>
    </div>
    <header class="flex min-h-12 flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl font-semibold">{{ view_title }}</h1>
    </header>

    <form id="token-create-form" method="post" class="card max-w-2xl bg-base-200">
        {% csrf_token %}
        <div class="card-body gap-6 p-6">
            {% include "management/_token_fields.html" %}
            <p class="muted text-sm">You see the key once, right after you create it.</p>
            <div class="flex flex-wrap gap-3 border-t border-base-300 pt-5">
                <button type="submit" class="btn btn-primary">Create key</button>
                <a class="btn btn-outline btn-primary" href="{% url 'tokens' %}">Cancel</a>
            </div>
        </div>
    </form>
</div>

<script>
  const pad = (num) => num.toString().padStart(2, '0');

  document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('{{ form.expires_at.id_for_label }}');
    const serverNowUtc = new Date("{{ now }}Z");
    input.min = `${serverNowUtc.getFullYear()}-${pad(serverNowUtc.getMonth() + 1)}-${pad(serverNowUtc.getDate())}T${pad(serverNowUtc.getHours())}:${pad(serverNowUtc.getMinutes())}`;
  });

  document.getElementById('token-create-form').addEventListener('submit', function () {
    const input = document.getElementById('{{ form.expires_at.id_for_label }}');
    if (!input.value) return;
    input.value = new Date(input.value).toISOString().slice(0, 16);
  });
</script>
{% endblock %}
