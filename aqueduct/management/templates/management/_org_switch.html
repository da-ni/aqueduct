<form method="post" action="{% url 'org_switch' %}" class="flex items-center gap-2 text-sm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <label for="org-switch" class="muted whitespace-nowrap">Switch organization</label>
    <select id="org-switch" name="org_id" class="select select-sm w-56" aria-describedby="org-switch-hint" onchange="this.form.submit()">
        {% for org in all_orgs %}
            <option value="{{ org.id }}"{% if org.id == org_object.id %} selected{% endif %}>{{ org.name }}</option>
        {% endfor %}
    </select>
    <span id="org-switch-hint" class="sr-only">Changes your organization on every page.</span>
</form>
